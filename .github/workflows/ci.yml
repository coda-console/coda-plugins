name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本检查要比较 PR 的目标分支。
          fetch-depth: 0
      - name: 改了的插件都升了版本
        if: github.event_name == 'pull_request'
        run: node scripts/check-versions.mjs "origin/${{ github.base_ref }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/*/package-lock.json
      - run: npm ci
      - name: 插件的 npm 依赖（照 Coda 装版本目录的样子，在各插件目录里 npm ci）
        run: node scripts/install-plugins.mjs
      - name: 检查包与插件的测试
        run: npm test
      - name: 插件契约与 Coda 同步的一致（check/coda/ 与 docs/agent-protocol.md 没被手改，依赖版本与 Coda 相同）
        run: node scripts/check-contract.mjs
      - name: 模板：清单 + 握手 + 一轮
        run: |
          for dir in templates/*/; do node bin/check.mjs "$dir" --live; done
          node bin/check.mjs templates/agent --live --prompt "wait 演示自主轮次"
      - name: 插件：只查清单（真握手与一轮要各家的 CLI 与登录，不在 CI 跑；入口用假的对端跑过的在 npm test 里）
        run: for dir in plugins/*/; do node bin/check.mjs "$dir" --manifest; done
