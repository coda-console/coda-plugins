name: Publish npm packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/install-plugins.mjs
      - run: npm test
      - run: node scripts/check-contract.mjs
      - name: Validate plugin manifests
        run: for dir in plugins/*/; do node bin/check.mjs "$dir" --manifest; done
      - name: Inspect npm archives
        run: node scripts/publish-npm.mjs --dry-run
  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish missing versions using OIDC
        run: node scripts/publish-npm.mjs
